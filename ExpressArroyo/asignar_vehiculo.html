<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Evitar caché -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma"       content="no-cache" />
  <meta http-equiv="Expires"      content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asignar Vehículo</title>
  <link rel="icon" href="img/logo2.png" type="image/jpeg">

  <style>
    body {
      margin: 0; font-family: Arial; background: url("img/mula3.jpg") center/cover fixed;
      color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .container {
      width: 100%; max-width: 900px; padding: 40px;
      background: rgba(0,0,0,0.8); border:2px solid #FFD700; border-radius:10px;
      box-sizing: border-box; margin-top:20px;
    }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .logo img { width:130px; }
    .nav-container a { color:#FFD700; font-size:20px; text-decoration:none; font-weight:bold; }
    .nav-container a:hover { text-decoration:underline; }
    .titulo-container h1 { font-size:40px; color:#FFD700; margin:0 0 20px; text-align:center; }
    .consulta-recuadro, .lista-recuadro {
      padding:20px; background:rgba(0,0,0,0.9); border:2px solid #FFD700; border-radius:10px;
      text-align:center; margin-bottom:20px;
    }
    .consulta-recuadro h2, .lista-recuadro h2 { font-size:32px; color:#FFD700; margin-bottom:20px; }
    .input-group {
      display:grid; grid-template-columns:150px 1fr; gap:12px; align-items:center;
      max-width:500px; margin:0 auto 15px;
    }
    .input-group label { text-align:right; color:#FFD700; font-weight:bold; }
    .input-group select {
      padding:8px; border:1px solid #FFD700; border-radius:4px; background:#111; color:white;
    }
    .btn-asignar {
      margin-top:15px; padding:10px 20px; background:#FFD700; color:black;
      border:none; border-radius:5px; font-weight:bold; cursor:pointer;
      transition:background 0.2s;
    }
    .btn-asignar:hover { background:#e6c200; }

    /* tabla asignaciones */
    table {
      width: 100%; border-collapse: collapse; margin-top: 10px;
    }
    th, td {
      padding: 8px; border: 1px solid #FFD700; text-align: left;
    }
    th {
      background: rgba(255,215,0,0.2); color: #FFD700;
    }
    .btn-eliminar {
      padding:4px 8px;
      background-image: linear-gradient(145deg, rgba(231,76,60,.9), rgba(231,76,60,.7));
      color: white;
      border: none; border-radius: 3px;
      font-size: 12px; font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-eliminar:hover {
      transform: scale(1.05);
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      background-image: linear-gradient(145deg, rgba(192,57,43,.9), rgba(144,39,27,.7));
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <a href="BienvenidoAdmin.html"><img src="img/logo3.png" alt="Logo"></a>
      </div>
      <div class="nav-container">
        <a href="conductores.html">←</a>
      </div>
    </header>

    <div class="titulo-container">
      <h1 id="tituloBienvenido">Bienvenido</h1>
    </div>

    <main>
      <!-- asignación -->
      <div class="consulta-recuadro">
        <h2>Asignación de vehículo al conductor</h2>
        <div class="input-group">
          <label for="selConductor">Conductor:</label>
          <select id="selConductor"><option>Cargando...</option></select>
        </div>
        <div class="input-group">
          <label for="selVehiculo">Vehículo:</label>
          <select id="selVehiculo"><option>Cargando...</option></select>
        </div>
        <button class="btn-asignar" id="btnAsignar">Asignar Vehículo</button>
        <div id="msgAsignacion" style="margin-top:15px;color:#FFD700;"></div>
      </div>

      <!-- listado -->
      <div class="lista-recuadro">
        <h2>Vehículos asignados</h2>
        <table id="tblAsignaciones">
          <thead>
            <tr>
              <th>Conductor</th>
              <th>Marca</th>
              <th>Modelo</th>
              <th>Fecha</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="5">Cargando...</td></tr>
          </tbody>
        </table>

        <!-- exportar -->
        <div style="text-align:center; margin-top:20px;">
          <button id="btnExportarAsignaciones"
                  style="
                    background-image: linear-gradient(145deg, rgba(52,152,219,0.9), rgba(52,152,219,0.7));
                    color: white;
                    padding: 6px 12px;
                    font-size: 12px;
                    font-weight: bold;
                    border: none;
                    border-radius: 3px;
                    cursor: pointer;
                    transition: transform 0.2s ease, box-shadow 0.2s ease, background-image 0.2s ease;
                  "
                  onmouseover="this.style.backgroundImage='linear-gradient(145deg, rgba(41,128,185,0.9), rgba(41,128,185,0.7))'"
                  onmouseout="this.style.backgroundImage='linear-gradient(145deg, rgba(52,152,219,0.9), rgba(52,152,219,0.7))'">
            Exportar Asignaciones
          </button>
        </div>

      </div>
    </main>
  </div>

  <script>
    // protección
    if (sessionStorage.getItem('loggedIn')!=='true') location.replace('index.html');
    window.addEventListener('pageshow', e => {
      const nav = performance.getEntriesByType('navigation')[0]||{};
      if ((e.persisted||nav.type==='back_forward') && sessionStorage.getItem('loggedIn')!=='true') {
        location.replace('index.html');
      }
    });

    // mostrar nombre y cargar
    document.addEventListener('DOMContentLoaded', () => {
      const nombre = sessionStorage.getItem('nombre');
      if (nombre) {
        document.getElementById('tituloBienvenido')
                .textContent = 'Bienvenido ' + decodeURIComponent(nombre);
      }
      cargarConductores();
      cargarVehiculos();
      listarAsignaciones();
    });

    function cargarConductores(){
      fetch('php/obtener_conductores.php')
        .then(r=>r.json())
        .then(list=>{
          const sel = document.getElementById('selConductor');
          sel.innerHTML = '<option value="">-- Seleccione --</option>';
          list.forEach(u=>{
            const o = document.createElement('option');
            o.value = u.id;
            o.textContent = `${u.nombre} ${u.apellido} (CC:${u.cc})`;
            sel.appendChild(o);
          });
        })
        .catch(console.error);
    }

    function cargarVehiculos(){
      fetch('php/obtener_vehiculos.php')
        .then(r=>r.json())
        .then(list=>{
          const sel = document.getElementById('selVehiculo');
          sel.innerHTML = '<option value="">-- Seleccione --</option>';
          list.forEach(v=>{
            const o = document.createElement('option');
            o.value = v.id_vehiculo;
            o.textContent = `${v.placa} — ${v.marca} ${v.modelo}`;
            sel.appendChild(o);
          });
        })
        .catch(console.error);
    }

    document.getElementById('btnAsignar').onclick = ()=> {
      const cid = document.getElementById('selConductor').value;
      const vid = document.getElementById('selVehiculo').value;
      const msg = document.getElementById('msgAsignacion');
      if (!cid || !vid) {
        msg.textContent = 'Debe elegir ambos.';
        return;
      }
      fetch('php/asignar_vehiculo.php',{
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:`conductor_id=${cid}&vehiculo_id=${vid}`
      })
      .then(r=>r.text())
      .then(t=>{
        msg.textContent = t;
        listarAsignaciones();
      })
      .catch(e=>{
        console.error(e);
        msg.textContent = 'Error al asignar.';
      });
    };

    function listarAsignaciones(){
      fetch('php/listar_asignaciones.php')
        .then(r=>r.json())
        .then(arr=>{
          const tbody = document.querySelector('#tblAsignaciones tbody');
          tbody.innerHTML = '';
          if (!arr.length) {
            tbody.innerHTML = '<tr><td colspan="5">No hay asignaciones</td></tr>';
          } else {
            arr.forEach(a=>{
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td>${a.conductor}</td>
                <td>${a.marca}</td>
                <td>${a.modelo}</td>
                <td>${a.fecha_asignacion}</td>
                <td>
                  <button class="btn-eliminar" data-id="${a.id}">
                    Eliminar
                  </button>
                </td>
              `;
              tbody.appendChild(tr);
            });
          }
        })
        .catch(console.error);
    }

    // Delegación para los botones eliminar
    document.querySelector('#tblAsignaciones tbody')
      .addEventListener('click', e => {
        if (e.target.matches('.btn-eliminar')) {
          const id = e.target.dataset.id;
          if (!confirm('¿Eliminar esta asignación?')) return;
          fetch(`php/eliminar_asignacion.php?id=${encodeURIComponent(id)}`, {
            method: 'POST'
          })
          .then(r=>r.text())
          .then(msg=>{
            alert(msg);
            listarAsignaciones();
          })
          .catch(console.error);
        }
      });

    // Exportar asignaciones
    document.getElementById('btnExportarAsignaciones').onclick = () => {
      window.location.href = 'php/exportar_asignaciones.php';
    };

    // ...cargarConductores(), cargarVehiculos(), listarAsignaciones()...

  document.getElementById('btnAsignar').onclick = ()=> {
    const cid = document.getElementById('selConductor').value;
    const vid = document.getElementById('selVehiculo').value;
    const msg = document.getElementById('msgAsignacion');
    msg.textContent = '';

    if (!cid || !vid) {
      msg.textContent = 'Debe elegir conductor y vehículo.';
      return;
    }

    fetch('php/asignar_vehiculo.php', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `conductor_id=${cid}&vehiculo_id=${vid}`
    })
    .then(async res => {
      const text = await res.text();
      if (res.status === 200) {
        msg.style.color = '#FFD700';
        msg.textContent = text;
        listarAsignaciones();
      } else if (res.status === 409) {
        msg.style.color = '#E74C3C';
        msg.textContent = text;  // "Este conductor ya tiene un vehículo asignado"
      } else {
        msg.style.color = '#E74C3C';
        msg.textContent = text || 'Error al asignar.';
      }
    })
    .catch(err => {
      console.error(err);
      msg.style.color = '#E74C3C';
      msg.textContent = 'Error de red.';
    });
  };
  </script>
</body>
</html>
