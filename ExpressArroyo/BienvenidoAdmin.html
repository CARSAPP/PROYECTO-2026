<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Evitar caché -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma"       content="no-cache" />
  <meta http-equiv="Expires"      content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bienvenido Administrador</title>
  <link rel="icon" href="img/logo2.png" type="image/jpeg">
  <link rel="stylesheet" href="css/styleBienvenidoAdmin.css">

  <script>
    // 1) Si no está marcado como logueado, vamos al login
    if (sessionStorage.getItem('loggedIn') !== 'true') {
      window.location.replace('index.html');
    }

    // 2) Actualiza el título con el nombre guardado en sessionStorage
    function actualizarTitulo() {
      const nombre = sessionStorage.getItem('nombre');
      if (nombre) {
        document.getElementById('tituloBienvenido')
                .textContent = 'Bienvenido ' + nombre;
      }
    }

    // 3) Detectar “Atrás/Adelante” desde caché, revalidar y refrescar título
    window.addEventListener('pageshow', function(event) {
      const nav = performance.getEntriesByType("navigation")[0] || {};
      if (event.persisted || nav.type === 'back_forward') {
        if (sessionStorage.getItem('loggedIn') !== 'true') {
          window.location.replace('index.html');
        } else {
          actualizarTitulo();
        }
      }
    });
  </script>
</head>
<body style="
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('img/mula3.jpg') no-repeat center center fixed;
  background-size: cover;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  position: relative;
">
  <div class="container">
    <header style="display:flex; justify-content:space-between; align-items:center; padding:20px;">
      <div class="logo">
        <a href="index.html" style="text-decoration:none;">
          <img src="img/logo3.png" alt="Travel Log" style="width:130px;">
        </a>
      </div>
      <button class="cerrar-sesion"
              onclick="cerrarSesion()"
              style="background:transparent; border:2px solid #FFD700; color:#FFD700; padding:8px 16px; border-radius:25px; cursor:pointer;">
        Cerrar Sesión
      </button>
    </header>

    <main style="text-align:center; flex:1; display:flex; flex-direction:column; justify-content:center;">
      <h1 id="tituloBienvenido" style="font-size:32px;color:#FFD700;margin-bottom:20px;">
        Bienvenido Administrador
      </h1>

      <div class="consulta-recuadro" style="
         display:inline-block;
         background:rgba(0,0,0,0.7);
         border:2px solid #FFD700;
         border-radius:10px;
         padding:30px;
       ">
        <h2 style="color:#FFD700;margin-bottom:15px;">Opciones de Gestión</h2>
        <div style="display:flex; gap:20px; justify-content:center;">
          <button onclick="location.href='conductores.html'"
                  style="padding:10px 20px; background:#FFD700; color:#000; border:none; border-radius:5px; cursor:pointer;">
            Conductores
          </button>
          <button onclick="location.href='BienvenidoAdmin2.html'"
                  style="padding:10px 20px; background:#FFD700; color:#000; border:none; border-radius:5px; cursor:pointer;">
            Viajes
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Llamar actualizarTitulo al cargar la página
    document.addEventListener('DOMContentLoaded', actualizarTitulo);

    // Función de logout
    function cerrarSesion() {
      fetch('php/logout.php')
        .finally(() => {
          sessionStorage.removeItem('loggedIn');
          sessionStorage.removeItem('nombre');
          window.location.replace('index.html');
        });
    }
  </script>
</body>
</html>
