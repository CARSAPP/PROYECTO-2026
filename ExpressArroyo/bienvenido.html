<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Evitar cache -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma"       content="no-cache" />
  <meta http-equiv="Expires"      content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido Conductor</title>
  <link rel="icon" href="img/logo2.png" type="image/jpeg">
  <link rel="stylesheet" href="css/styleBienvenido.css">

  <style>
    /* Tarjeta de usuario + vehículo */
    .tarjeta-asignacion {
      background: rgba(0,0,0,0.7);
      border: 2px solid #FFD700;
      border-radius: 8px;
      padding: 20px;
      margin: 20px auto;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: white;
    }
    .tarjeta-asignacion h3 {
      margin: 0;
      color: #FFD700;
    }
    .tarjeta-asignacion .campo {
      display: flex;
      justify-content: space-between;
    }
    .tarjeta-asignacion .campo span:first-child {
      font-weight: bold;
      color: #DDD;
    }
  </style>

  <script>
    // Si no está logueado en sessionStorage, forza redirect al login
    if (sessionStorage.getItem('loggedIn') !== 'true') {
      window.location.replace('index.html');
    }
    // Proteger back/forward
    window.addEventListener('pageshow', function(event) {
      const nav = performance.getEntriesByType("navigation")[0] || {};
      if (event.persisted || nav.type === 'back_forward') {
        if (sessionStorage.getItem('loggedIn') !== 'true') {
          window.location.replace('index.html');
        }
      }
    });
  </script>
</head>
<body style="
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('img/mula3.jpg') no-repeat center center fixed;
  background-size: cover;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  position: relative;
">
  
  <div class="container">
    <header class="header-container">
      <div class="logo">
        <img src="img/logo3.png" alt="Logo">
      </div>
      <button class="cerrar-sesion" onclick="cerrarSesion()">Cerrar Sesión</button>
    </header>

    <main>
      <h1 id="tituloBienvenido">Bienvenido Conductor</h1>

      <!-- Aquí irá la tarjeta -->
      <div id="tarjetaContainer"></div>

      <div class="registro-recuadro">
        <div class="nuevo-registro">
          <a href="Formulario.html" class="boton-registro">+</a>
          <span>Nuevo Registro</span>
        </div>
      </div>

      <section class="formulario-guardado">
        <h2>Formularios Guardados</h2>
        <iframe src="php/mostrar_formularios.php"
                width="100%" height="400px"
                style="border: none;"></iframe>
      </section>
    </main>
  </div>

  <script>
    // Mostrar nombre desde sessionStorage (no querystring)
    document.addEventListener('DOMContentLoaded', () => {
      const nombre = sessionStorage.getItem('nombre');
      const apellido = sessionStorage.getItem('apellido');
      const cc = sessionStorage.getItem('cc');
      if (nombre && apellido) {
        document.getElementById("tituloBienvenido")
                .textContent = `Bienvenido ${decodeURIComponent(nombre)} ${decodeURIComponent(apellido)}`;
      }

  </script>
</body>
</html>
